[package]
name = "hashendra"
version = "2.0.0"
edition = "2024"

[dependencies]
regex = "1"
rayon = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
lazy_static = "1"
memmap2 = "0.7"
walkdir = "2"
num-bigint = "0.4"
itertools = "0.13"
hex = "0.4"
digest = "0.10"
md-5 = "0.10"
sha-1 = "0.10"
sha2 = "0.10"
blake3 = "1"
base64 = "0.22"
kamadak-exif = "0.5"
zip = "2"
quick-xml = "0.36"
flate2 = "1"
